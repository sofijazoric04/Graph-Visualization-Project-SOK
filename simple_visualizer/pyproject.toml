[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-visualizer"
version = "1.0.0"
dependencies = ["api"]

[project.entry-points."graph.visualizer"]
simple = "simple_visualizer.plugin:SimpleVisualizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_visualizer*"]