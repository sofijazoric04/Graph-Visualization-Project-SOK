[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "block-visualizer"
version = "1.0.0"
dependencies = ["api"]

[project.entry-points."graph.visualizer"]
block = "block_visualizer.plugin:BlockVisualizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["block_visualizer*"]